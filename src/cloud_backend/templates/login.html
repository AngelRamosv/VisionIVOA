<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IVOA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=20">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: var(--brand-red);
            box-shadow: 0 0 0 2px rgba(225, 6, 0, 0.2);
        }
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background: var(--brand-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }
        button[type="submit"]:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="bg-mesh">
        <div class="mesh-orb-1"></div>
        <div class="mesh-orb-2"></div>
        <div class="mesh-orb-3"></div>
    </div>

    <div class="login-card">
        <div style="display:flex; justify-content:center; margin-bottom: 2rem;">
            <div class="brand-logo" style="font-size: 2rem; padding: 0.8rem 1.5rem;">
                izzi <span class="brand-ivoa" style="font-size: 1rem;">IVOA</span>
            </div>
        </div>
        
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Acceso Seguro a Inteligencia Operativa</p>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Usuario / Empleado ID</label>
                <input type="text" name="username" required placeholder="ej. admin">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            alert('Credenciales incorrectas');
        }
    </script>
</body>
</html>
